    function getCharacterIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("char");
      return id ? id.toLowerCase() : null;
    }

    function loadCharacter(charKey) {
      const data = CHARACTER_DATA[charKey];

      const nameEl = document.getElementById("bio-name");
      const aliasEl = document.getElementById("bio-alias");
      const factionEl = document.getElementById("bio-faction");
      const regionEl = document.getElementById("bio-region");
      const typeEl = document.getElementById("bio-type");
      const imgEl = document.getElementById("bio-image");
      const textEl = document.getElementById("bio-text");
      const notesEl = document.getElementById("bio-notes");
      const fileIdEl = document.getElementById("bio-file-id");

      if (!data) {
        nameEl.textContent = "UNKNOWN SUBJECT";
        aliasEl.textContent = "NO MATCH IN ORION CHARACTER ARCHIVE";
        factionEl.textContent = "UNIDENTIFIED";
        regionEl.textContent = "UNKNOWN";
        typeEl.textContent = "N/A";
        imgEl.src = "media/characters/placeholder.png"; // optional placeholder you can add
        imgEl.alt = "Unknown character";
        textEl.textContent =
          "Requested subject ID returned no dossier. Either this record is classified beyond this node's clearance, or the archive has not yet been synchronized.";
        notesEl.textContent = "Try accessing this profile again after the next ORION sync cycle.";
        fileIdEl.textContent = "FILE: NC-????-???";
        return;
      }

      nameEl.textContent = data.name;
      aliasEl.textContent = data.alias;
      factionEl.textContent = data.faction;
      regionEl.textContent = data.region;
      typeEl.textContent = data.type;
      imgEl.src = data.image;
      imgEl.alt = data.name + " portrait";
      textEl.textContent = data.bio;
      notesEl.textContent = data.notes;
      fileIdEl.textContent = "FILE: " + data.id;
    }

    document.addEventListener("DOMContentLoaded", () => {
      const id = getCharacterIdFromUrl() || "panam"; // default
      loadCharacter(id);

      const closeBtn = document.getElementById("bio-close-btn");
      closeBtn.addEventListener("click", () => {
        window.location.href = "characters.html";
      });

      // ESC to close
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          window.location.href = "characters.html";
        }
      });
    });
  </script>


<script src="intrusion.js"></script>



<script>
  // Any link that goes to index.html will set "skip boot" for the next index visit
  document.querySelectorAll('a[href$="index.html"], a[href*="index.html#"], a[href*="index.html?"]').forEach(a => {
    a.addEventListener("click", () => {
      sessionStorage.setItem("orion_skip_boot", "1");
    });
  });
</script>
